<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <dir>/data/local/tmp/fonts</dir>
    <cachedir>/data/local/tmp/fontconfig-cache</cachedir>

    <alias binding="same">
        <family>Noto Naskh Arabic</family>
        <prefer>
            <family>Noto Naskh Arabic</family>
            <family>Noto Sans</family>
        </prefer>
    </alias>
    <alias binding="same">
        <family>Noto Sans</family>
        <prefer>
            <family>Noto Sans</family>
            <family>Noto Naskh Arabic</family>
        </prefer>
    </alias>
    <alias binding="same">
        <family>NotoNaskhArabic-Regular</family>
        <prefer>
            <family>Noto Naskh Arabic</family>
            <family>Noto Sans</family>
        </prefer>
    </alias>
    <alias binding="same">
        <family>NotoSans-Regular</family>
        <prefer>
            <family>Noto Sans</family>
            <family>Noto Naskh Arabic</family>
        </prefer>
    </alias>
    <alias>
        <family>Arial</family>
        <prefer>
            <family>Noto Sans</family>
            <family>Noto Naskh Arabic</family>
        </prefer>
    </alias>
    <alias>
        <family>Default</family>
        <prefer>
            <family>Noto Naskh Arabic</family>
            <family>Noto Sans</family>
        </prefer>
    </alias>
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Noto Naskh Arabic</family>
            <family>Noto Sans</family>
        </prefer>
    </alias>
    <alias>
        <family>serif</family>
        <prefer>
            <family>Noto Naskh Arabic</family>
            <family>Noto Sans</family>
        </prefer>
    </alias>

    <match target="pattern">
        <test name="lang" compare="contains">
            <string>ar</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Naskh Arabic</string>
        </edit>
    </match>
</fontconfig>
