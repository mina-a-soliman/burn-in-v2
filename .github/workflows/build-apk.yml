name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Also assemble a release APK (signed with CI keystore if secrets exist)
        type: boolean
        default: true

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  ffmpeg:
    name: FFmpeg native libraries
    uses: ./.github/workflows/native-cache.yml
    permissions:
      contents: read
      actions: write

  assemble:
    name: Assemble APK
    needs: ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      BUILD_RELEASE: ${{ github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_release) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew native/scripts/*.sh

      - name: Verify bundled fonts
        run: |
          test -f app/src/main/assets/fonts/NotoNaskhArabic-Regular.ttf
          test -f app/src/main/assets/fonts/NotoSans-Regular.ttf

      - name: Restore FFmpeg jniLibs
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-jniLibs
          path: app/src/main/jniLibs

      - name: Restore FFmpeg headers
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-headers
          path: native/prebuilt

      - name: Verify FFmpeg native artifacts
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libavcodec.so
          test -f app/src/main/jniLibs/armeabi-v7a/libavcodec.so
          test -f native/prebuilt/include/libavformat/avformat.h
          echo "FFmpeg headers and jniLibs are present"

      - name: Decode release keystore
        if: ${{ env.BUILD_RELEASE == 'true' && env.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${SIGNING_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          echo "SIGNING_STORE_FILE=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"
          echo "SIGNING_STORE_PASSWORD=${SIGNING_STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "SIGNING_KEY_ALIAS=${SIGNING_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "SIGNING_KEY_PASSWORD=${SIGNING_KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify FFmpeg is packaged in debug APK
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          unzip -l "${apk}" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/libavcodec\.so'
          unzip -l "${apk}" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/libburnffmpeg\.so'
          unzip -l "${apk}" | grep -F 'NotoNaskhArabic-Regular.ttf'
          unzip -l "${apk}" | grep -F 'NotoSans-Regular.ttf'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: burn-subtitle-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Assemble release APK
        if: ${{ env.BUILD_RELEASE == 'true' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ env.BUILD_RELEASE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: burn-subtitle-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload mapping
        if: ${{ env.BUILD_RELEASE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Job summary
        if: success()
        run: |
          {
            echo "## Burn Subtitle APK"
            echo
            echo "Download **burn-subtitle-debug** (and **burn-subtitle-release** if this run built it) from this workflow's Artifacts."
            echo
            echo '```'
            ls -lh app/build/outputs/apk/*/*.apk 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
